name: "Prebuild checks"

on:
  pull_request:
    # Crypto-only changes have a focused optimized/sanitizer/Valgrind gate.
    # These legacy monorepo generation checks exercise unrelated products.
    paths-ignore:
      - "crypto/**"
      - ".github/workflows/crypto.yml"
      - ".github/workflows/fixup_check.yml"
      - ".github/workflows/prebuild.yml"

jobs:

  style_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@8d6d5e949675fbadb765c6b1a975047fa5f09b27 # v13
        with:
          nix_path: nixpkgs=channel:nixos-unstable
        name: "Run script"
      - run: nix-shell --run "poetry install"
      - run: nix-shell --run "poetry run make style_check"

  defs_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: "recursive"
          fetch-depth: 0
      - uses: cachix/install-nix-action@8d6d5e949675fbadb765c6b1a975047fa5f09b27 # v13
        with:
          nix_path: nixpkgs=channel:nixos-unstable
        name: "Run script"
      - run: nix-shell --run "poetry install"
      - run: nix-shell --run "poetry run make defs_check"

  gen_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: "recursive"
          fetch-depth: 0
      - uses: cachix/install-nix-action@8d6d5e949675fbadb765c6b1a975047fa5f09b27 # v13
        with:
          nix_path: nixpkgs=channel:nixos-unstable
        name: "Run script"
      - run: nix-shell --run "poetry install"
      - run: nix-shell --run "poetry run make gen_check"
